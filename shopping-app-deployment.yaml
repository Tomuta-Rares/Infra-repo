---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-app
  #namespace: shopping-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopping
  template:
    metadata:
      labels:
        app: shopping
    spec:
      containers:
        - name: shopping
          image: rarestomuta/shopping-app:eedc9ffddde6b9e8e59d8c63f477f6a0217eed4f
         # resources:
           #requests:
           # cpu: "200m"
          #  memory: "256Mi"
         # limits:
           # cpu: "500m"
           # memory: "512Mi"

          env:
          - name: DATABASE_URL
            value: "mysql+mysqlconnector://user:userpass@mysql.mysql.svc.cluster.local:3306/shopping"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
