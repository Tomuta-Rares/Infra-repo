apiVersion: v2
name: observability-stack
description: Umbrella chart for observability components
type: application
version: 0.1.0

dependencies:
  - name: loki
    version: 6.27.0
    repository: https://grafana.github.io/helm-charts

  - name: grafana
    version: 8.10.2
    repository: https://grafana.github.io/helm-charts

  - name: tempo
    version: 1.7.1
    repository: https://grafana.github.io/helm-charts

  - name: kube-prometheus-stack
    alias: prometheus
    version: "87.17.0"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: prometheus.enabled