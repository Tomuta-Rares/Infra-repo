loki:
  enabled: true

  deploymentMode: SingleBinary

  loki:
    auth_enabled: false

    commonConfig:
      replication_factor: 1

    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    storage:
      type: filesystem
      bucketNames:
        chunks: chunks
        ruler: ruler
        admin: admin

  singleBinary:
    replicas: 1

  chunksCache:
    enabled: false

  resultsCache:
    enabled: false

  gateway:
    enabled: false

  backend:
    replicas: 0

  read:
    replicas: 0

  write:
    replicas: 0

  lokiCanary:
    enabled: false

  test:
    enabled: false

grafana:
  enabled: true

  adminUser: admin
  adminPassword: admin

  service:
    type: ClusterIP

  persistence:
    enabled: false

  testFramework:
    enabled: false

promtail:
  enabled: true

  config:
    clients:
      - url: http://observability-stack-loki:3100/loki/api/v1/push

    snippets:
      scrapeConfigs: |
        - job_name: kubernetes-pods-default
          pipeline_stages:
            - cri: {}

          kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                  - default

          relabel_configs:
            - source_labels:
                - __meta_kubernetes_pod_controller_name
              regex: ([0-9a-z-.]+?)(-[0-9a-f]{8,10})?
              action: replace
              target_label: __tmp_controller_name

            - source_labels:
                - __meta_kubernetes_pod_label_app_kubernetes_io_name
                - __meta_kubernetes_pod_label_app
                - __tmp_controller_name
                - __meta_kubernetes_pod_name
              regex: ^;*([^;]+)(;.*)?$
              action: replace
              target_label: app

            - source_labels:
                - __meta_kubernetes_pod_label_app_kubernetes_io_instance
                - __meta_kubernetes_pod_label_instance
              regex: ^;*([^;]+)(;.*)?$
              action: replace
              target_label: instance

            - source_labels:
                - __meta_kubernetes_pod_label_app_kubernetes_io_component
                - __meta_kubernetes_pod_label_component
              regex: ^;*([^;]+)(;.*)?$
              action: replace
              target_label: component

            - action: replace
              source_labels:
                - __meta_kubernetes_pod_node_name
              target_label: node_name

            - action: replace
              source_labels:
                - __meta_kubernetes_namespace
              target_label: namespace

            - action: replace
              replacement: $1
              separator: /
              source_labels:
                - namespace
                - app
              target_label: job

            - action: replace
              source_labels:
                - __meta_kubernetes_pod_name
              target_label: pod

            - action: replace
              source_labels:
                - __meta_kubernetes_pod_container_name
              target_label: container

            - action: replace
              replacement: /var/log/pods/*$1/*.log
              separator: /
              source_labels:
                - __meta_kubernetes_pod_uid
                - __meta_kubernetes_pod_container_name
              target_label: __path__

            - action: replace
              regex: true/(.*)
              replacement: /var/log/pods/*$1/*.log
              separator: /
              source_labels:
                - __meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash
                - __meta_kubernetes_pod_annotation_kubernetes_io_config_hash
                - __meta_kubernetes_pod_container_name
              target_label: __path__