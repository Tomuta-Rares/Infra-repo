replicaCount: 2

image:
  repository: rarestomuta/shopping-app
  tag: "bbe820982320fa0f68508a48aa95314d6e6ee6ed"
  pullPolicy: IfNotPresent

frontend:
  image:
    repository: rarestomuta/shopping-frontend
    pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 300m
    memory: 512Mi

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  host: shopping.local
  tlsSecret: shopping-tls-secret

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 50

env:
  databaseUrl: "mysql+mysqlconnector://user:userpass@mysql.mysql.svc.cluster.local:3306/shopping"
  keycloakIssuer: "https://auth.local:8443/auth/realms/devops-lvlup"
  keycloakJwksUrl: "http://keycloak-keycloakx-http.keycloak.svc.cluster.local/auth/realms/devops-lvlup/protocol/openid-connect/certs"
