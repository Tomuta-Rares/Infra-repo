apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mysql-pass-aws
  namespace: mysql
spec:
  refreshInterval: 1m

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: mysql-pass-aws
    creationPolicy: Owner

  data:
  - secretKey: password
    remoteRef:
      key: dev-shopping/mysql
      property: password

  - secretKey: root-password
    remoteRef:
      key: dev-shopping/mysql
      property: rootPassword