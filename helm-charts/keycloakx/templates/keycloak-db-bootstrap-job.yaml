apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-db-bootstrap
  namespace: keycloak
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: keycloak-db-bootstrap
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "rootpass"
            - name: KEYCLOAK_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for MySQL..."

              until mysqladmin ping -h mysql.mysql.svc.cluster.local -uroot -p"$MYSQL_ROOT_PASSWORD" --silent; do
                echo "MySQL not ready yet..."
                sleep 5
              done

              echo "MySQL is ready. Bootstrapping Keycloak database..."

              mysql -h mysql.mysql.svc.cluster.local -uroot -p"$MYSQL_ROOT_PASSWORD" <<SQL
              CREATE DATABASE IF NOT EXISTS keycloak;
              CREATE USER IF NOT EXISTS 'keycloak_user'@'%' IDENTIFIED BY '${KEYCLOAK_DB_PASSWORD}';
              ALTER USER 'keycloak_user'@'%' IDENTIFIED BY '${KEYCLOAK_DB_PASSWORD}';
              GRANT ALL PRIVILEGES ON keycloak.* TO 'keycloak_user'@'%';
              FLUSH PRIVILEGES;
              SQL

              echo "Keycloak database bootstrap completed."