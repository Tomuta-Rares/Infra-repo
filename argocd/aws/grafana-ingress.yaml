apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-extras
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Tomuta-Rares/Infra-repo
    targetRevision: HEAD
    path: grafana-ingress

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true