apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-ingress
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Tomuta-Rares/Infra-repo
    targetRevision: HEAD
    path: ingress/argocd-ingress.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true